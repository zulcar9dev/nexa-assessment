# =================================================
# GitHub Actions - Deploy Nexa Assessment
# =================================================
# Automated build and deployment pipeline
#
# Required Secrets (Settings > Secrets and variables > Actions):
#   - DATABASE_URL: PostgreSQL connection string
#   - NEXTAUTH_SECRET: NextAuth secret key
#   - SERVER_HOST: Production server hostname
#   - SERVER_USER: SSH username for deployment
#   - SSH_PRIVATE_KEY: SSH private key for authentication

name: Deploy Nexa Assessment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip deployment (build only)"
        required: false
        default: "false"

env:
  NODE_VERSION: "20"

jobs:
  # ===================
  # Build & Test
  # ===================
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: frontend
        run: npx prisma generate

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build Application
        working-directory: frontend
        run: npm run build
        env:
          # Dummy values for build time (not used at runtime)
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          NEXTAUTH_SECRET: "build-time-secret-not-used-in-production"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            frontend/.next
            frontend/public
            frontend/templates
          retention-days: 1

  # ===================
  # Deploy to Production
  # ===================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event.inputs.skip_deploy != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "=== Starting deployment ==="
            cd /var/www/nexa-assessment

            echo "=== Pulling latest changes ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Installing dependencies ==="
            cd frontend
            npm ci --production

            echo "=== Generating Prisma client ==="
            npx prisma generate

            echo "=== Running database migrations ==="
            npx prisma migrate deploy

            echo "=== Building application ==="
            npm run build

            echo "=== Reloading PM2 ==="
            pm2 reload ecosystem.config.js --env production

            echo "=== Deployment completed ==="
            pm2 status

      - name: Notify on Success
        if: success()
        run: echo "✅ Deployment successful!"

      - name: Notify on Failure
        if: failure()
        run: echo "❌ Deployment failed!"

  # ===================
  # Docker Build (Optional)
  # ===================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: nexa-assessment:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
